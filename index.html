    <script>
      // Guard against iframe/browser environment where window.fetch has only a getter
      (function () {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return currentFetch || originalFetch;
            },
            set: function (newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (err) {
          // If property cannot be redefined, silently ignore
        }
      })();
    </script>
